<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Ed Vault Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
--primary:#2563eb;
--accent:#6366f1;
--bg:#eef2ff;
--card:#ffffff;
--text:#1e293b;
--shadow:0 20px 40px rgba(0,0,0,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:linear-gradient(135deg,#eef2ff,#e0e7ff);
}

/* HEADER */
.header{
padding:20px;
background:linear-gradient(135deg,#2563eb,#6366f1);
color:white;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
box-shadow:var(--shadow);
text-align:center;
}

.header h1{font-size:20px;}
.header p{font-size:12px;opacity:0.9;margin-top:4px;}

/* REGISTER */
.register{
max-width:320px;
margin:30px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:var(--shadow);
}

.input{
position:relative;
margin-bottom:12px;
}
.input i{
position:absolute;top:12px;left:12px;color:#64748b;
}
.input input,.input select{
width:100%;
padding:12px 12px 12px 38px;
border-radius:10px;
border:1px solid #ddd;
}

.primary-btn{
width:100%;
padding:13px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,var(--primary),var(--accent));
color:white;
font-weight:600;
cursor:pointer;
}

/* PAGE */
.page{display:none;padding:16px;padding-bottom:100px;}
.page.active{display:block;}

/* SEARCH */
.search{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:12px;
}

/* CARD */
.card{
background:white;
border-radius:16px;
padding:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow);
  font-size:14px;
}

.btn{
background:var(--primary);
color:white;
border:none;
padding:4px 12px;
border-radius:8px;
cursor:pointer;
}

/* NAV */
.nav{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:420px;
background:white;
border-radius:20px;
display:none;
justify-content:space-around;
padding:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.nav button{
border:none;
background:none;
display:flex;
flex-direction:column;
align-items:center;
font-size:11px;
position:relative;
}

.nav i{font-size:18px;color:var(--primary);}

/* BADGE */
.badge{
position:absolute;
top:-3px;
right:6px;
background:red;
color:white;
font-size:10px;
padding:2px 6px;
border-radius:10px;
display:none;
}

/* NOTICE */
.notice{
background:white;
padding:14px;
border-radius:14px;
margin-bottom:10px;
box-shadow:var(--shadow);
}
.notice{
font-size:14px; /* change this value */
}
/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}
.popup-box{
background:white;
padding:20px;
border-radius:16px;
text-align:center;
width:300px;
}
.popup button{
margin-top:10px;
padding:10px;
background:var(--primary);
color:white;
border:none;
border-radius:8px;
}

/* CHECKBOX */
.checkbox{
display:flex;
align-items:center;
gap:8px;
font-size:13px;
margin:10px 0;
}
</style>
</head>

<body>

<div class="header">
<h1><i class="fa-solid fa-graduation-cap"></i> B.Ed Vault</h1>
<p id="welcomeText">Smart Study App</p>
</div>


<!-- REGISTER -->
<div id="registerPage" class="register">

<h2 style="text-align:center;margin-bottom:10px;">Student Registration</h2>

<div class="input">
<i class="fa fa-user"></i>
<input id="name" placeholder="Full Name">
</div>

<div class="input">
<i class="fa fa-calendar"></i>
<input id="dob" type="date">
</div>

<div class="input">
<i class="fa fa-venus-mars"></i>
<select id="gender">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input">
<i class="fa fa-school"></i>
<input id="college" placeholder="College">
</div>

<div class="input">
<i class="fa fa-location-dot"></i>
<input id="district" placeholder="District">
</div>

<div class="input">
<i class="fa fa-phone"></i>
<input id="phone" placeholder="Phone">
</div>

<!-- NEW: PEDAGOGY -->
<div class="input">
<i class="fa fa-book-open"></i>
<select id="pedagogy">
<option value="">Select Pedagogy</option>
<option>English</option>
<option>Tamil</option>
<option>Maths</option>
<option>Science</option>
<option>Social Science</option>
<option>Computer Science</option>
</select>
</div>

<div class="input">
<i class="fa fa-language"></i>
<select id="medium">
<option value="">Medium</option>
<option>English</option>
<option>Tamil</option>
</select>
</div>

<div class="input">
<i class="fa fa-layer-group"></i>
<select id="semester">
<option value="">Semester</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
</select>
</div>

<div class="checkbox">
<input type="checkbox" id="agree">
<label>I agree to Terms</label>
</div>

<button class="primary-btn" onclick="registerUser()">Register</button>

</div>

<!-- HOME -->
<div id="home" class="page">

<div class="card">
📚 Notes
<button class="btn" onclick="showPage('notes')">Open</button>
</div>

<div class="card">
🔔 Updates
<button class="btn" onclick="showPage('notices')">Open</button>
</div>

<!-- 🔥 PREMIUM RESALE -->
<div class="card" style="border-left:4px solid gold">
💰 Resale Your Books
<button class="btn" style="background:gold;color:black" onclick="openResale()">Sell</button>
</div>

<!-- 🔥 BUY BOOK SECTION -->
<div id="buyBooks"></div>

</div>

  <!-- RESALE POPUP -->
<div id="resalePopup" class="popup">
<div class="popup-box">

<h3>Sell Your Book</h3>

<input id="bookName" placeholder="Book Name"><br><br>
<input id="author" placeholder="Author"><br><br>
<input id="edition" placeholder="Edition"><br><br>
<input id="price" placeholder="Price"><br><br>

<label>Upload 2 Images</label><br>
<input type="file" id="img1"><br>
<input type="file" id="img2"><br><br>

<button onclick="sendResale()">Send</button>
<button onclick="closeResale()">Cancel</button>

</div>
</div>

<!-- THANK YOU POPUP -->
<div id="thankPopup" class="popup">
<div class="popup-box">
<h3>✅ Thank You!</h3>
<p>Your request submitted</p>
<button onclick="closeThank()">Close</button>
</div>
</div>

<!-- NOTES -->
<div id="notes" class="page">
<h3 id="semTitle"></h3><br/>
<input id="search" class="search" placeholder="Search..." onkeyup="searchNotes()">
<div id="noteList"></div>
</div>

<!-- NOTICES -->
<div id="notices" class="page">
<div id="noticeList"></div>
</div>

<!-- NAV -->
<div id="nav" class="nav">
<button onclick="showPage('home')"><i class="fa fa-house"></i>Home</button>
<button onclick="showPage('notes')"><i class="fa fa-book"></i>Notes</button>
<button onclick="showPage('notices')">
<i class="fa fa-bell"></i>Updates
<span id="badge" class="badge">1</span>
</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<div class="popup-box">
<div id="popupMsg"></div>
<button onclick="popup.style.display='none'">OK</button>
</div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0yVkhugqqVYtKK-9xLNOJ981ob5GnDI8_gTApwgmAwxC0OsWIWZHI_fajvKFGxihr/exec";

/* ================= POPUP ================= */
function showPopup(msg){
document.getElementById("popupMsg").innerText = msg;
document.getElementById("popup").style.display = "flex";
}

/* ================= REGISTER ================= */
function registerUser(){

let data = {
name: document.getElementById("name").value.trim(),
dob: document.getElementById("dob").value,
gender: document.getElementById("gender").value,
college: document.getElementById("college").value.trim(),
district: document.getElementById("district").value.trim(),
phone: document.getElementById("phone").value.trim(),
pedagogy: document.getElementById("pedagogy").value,
medium: document.getElementById("medium").value,
semester: document.getElementById("semester").value
};

/* VALIDATION */
for(let key in data){
if(!data[key]){
showPopup("⚠️ Fill all fields");
return;
}
}

if(!document.getElementById("agree").checked){
showPopup("⚠️ Accept Terms");
return;
}

/* SAVE */
localStorage.setItem("user", JSON.stringify(data));

/* SEND TO GOOGLE SHEET */
fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

showPopup("🎉 Registration Successful!");

setTimeout(()=>location.reload(),1500);
}

/* ================= INIT ================= */
window.addEventListener("DOMContentLoaded", ()=>{

let user = JSON.parse(localStorage.getItem("user"));

if(user){

document.getElementById("registerPage").style.display="none";
document.getElementById("nav").style.display="flex";
document.getElementById("home").classList.add("active");

document.getElementById("welcomeText").innerHTML =
"Welcome, " + user.name + "<br><span style='font-size:12px;opacity:0.8'>" + user.college + "</span>";
loadNotes();
loadNotices();
  loadBuyBooks();
}

});

/* ================= BOOK DATA ================= */
const books = [

/* ================= BD1CE ================= */

{type:"core", sem:"Semester 1", medium:"English", title:"BD1CE Unit 2 ENG", file:"BD1CE Unit-2 ENG.pdf"},

{type:"core", sem:"Semester 1", medium:"English", title:"BD1CE Unit 6 ENG", file:"BD1CE Unit-6 ENG.pdf"},
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1CE Unit 6 TAM", file:"BD1CE Unit-6 TAM.pdf"},

{type:"core", sem:"Semester 1", medium:"English", title:"BD1CE Unit 7 ENG", file:"BD1CE Unit-7 ENG.pdf"},
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1CE Unit 7 TAM", file:"BD1CE Unit-7 TAM.pdf"},

/* ================= BD1EP ================= */
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1EP Unit 1 TAM", file:"BD1EP Unit-1 TAM.pdf"},
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1EP Unit 1 TAM (Alt)", file:"BD1EP Unit-1 TAM(1).pdf"},

{type:"core", sem:"Semester 1", medium:"English", title:"BD1EP Unit 2 ENG", file:"BD1EP Unit-2 ENG.pdf"},
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1EP Unit 2 TAM", file:"BD1EP Unit-2 TAM.pdf"},

{type:"core", sem:"Semester 1", medium:"English", title:"BD1EP Unit 3 ENG", file:"BD1EP Unit-3 ENG.pdf"},
{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1EP Unit 3 TAM", file:"BD1EP Unit-3 TAM.pdf"},

{type:"core", sem:"Semester 1", medium:"Tamil", title:"BD1TL Unit 5 TAM", file:"BD1TL Unit-5 TAM.pdf"}

];

/* ================= LOAD NOTES ================= */
function loadNotes(){

let user = JSON.parse(localStorage.getItem("user"));
let list = document.getElementById("noteList");

list.innerHTML = "";
document.getElementById("semTitle").innerText = user.semester + " Notes";

let found = false;

books.forEach(b=>{

if(
b.sem === user.semester &&
(
  /* ✅ CORE → FILTER BY MEDIUM */
  (b.type === "core" && b.medium === user.medium) ||

  /* ✅ PEDAGOGY → FILTER BY BOTH */
  (
    b.type === "pedagogy" &&
    b.pedagogy === user.pedagogy &&
    b.medium === user.medium
  )
)
){
addNote(b);
found = true;
}

});

if(!found){
list.innerHTML = `<div style="text-align:center;margin-top:30px">No Notes Found</div>`;
}

}
/* ================= ADD CARD ================= */
function addNote(b){
document.getElementById("noteList").innerHTML += `
<div class="card">
<div>
<i class="fa-solid fa-file-pdf" style="color:#e11d48"></i>
${b.title}
</div>
<button class="btn" onclick="openPDF('${b.file}')">Open</button>
</div>`;
}

/* ================= SEARCH ================= */
function searchNotes(){
let s = document.getElementById("search").value.toLowerCase();

document.querySelectorAll("#noteList .card").forEach(c=>{
c.style.display = c.innerText.toLowerCase().includes(s) ? "flex" : "none";
});
}

/* ================= PDF ================= */
function openPDF(file){

let url = "https://aro5683.github.io/B.Ed-Viewer/web/PDFs/" + file;
let viewerURL = "web/viewer.html?file=" + encodeURIComponent(url);

window.location.href = viewerURL;
}

/* ================= NAV ================= */
function showPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");

if(p==="notices"){
document.getElementById("badge").style.display="none";
}
}

/* ================= NOTIFICATIONS ================= */
async function loadNotices(){

const proxy="https://api.codetabs.com/v1/proxy/?quest=";
const target="https://www.tnteu.ac.in/notifications.php?nid=5";

try{

let res=await fetch(proxy+encodeURIComponent(target));
let html=await res.text();

let doc=new DOMParser().parseFromString(html,"text/html");
let links=doc.querySelectorAll(".sectionWrapper a");

let first="", saved=localStorage.getItem("lastNotice"), out="";

links.forEach((a,i)=>{

if(i>10) return;

let title=a.innerText;
let url="https://www.tnteu.ac.in/"+a.getAttribute("href");

if(i===0) first=title;

out+=`
<div class="notice">
${title}
<button class="btn" onclick="window.open('${url}')">View</button>
</div>`;
});

document.getElementById("noticeList").innerHTML = out;

if(saved && saved !== first){
document.getElementById("badge").style.display="block";
}

localStorage.setItem("lastNotice", first);

}catch{
document.getElementById("noticeList").innerText = "Failed to load";
}

}

  /* ================= RESALE POPUP ================= */

function openResale(){
document.getElementById("resalePopup").style.display="flex";
}

function closeResale(){
document.getElementById("resalePopup").style.display="none";
}

/* ================= SEND TO WHATSAPP ================= */

function sendResale(){

let name = document.getElementById("bookName").value;
let author = document.getElementById("author").value;
let edition = document.getElementById("edition").value;
let price = document.getElementById("price").value;

if(!name || !author || !edition || !price){
alert("Fill all fields");
return;
}

/* WHATSAPP MESSAGE */
let msg =
`📚 Book Resale Request

Book: ${name}
Author: ${author}
Edition: ${edition}
Price: ₹${price}

I want to sell this book.`;

/* OPEN WHATSAPP */
let url = "https://wa.me/919655969516?text=" + encodeURIComponent(msg);

window.open(url);

/* CLOSE POPUP */
closeResale();

/* THANK YOU POPUP */
setTimeout(()=>{
document.getElementById("thankPopup").style.display="flex";
},1000);

}

function closeThank(){
document.getElementById("thankPopup").style.display="none";
}

/* ================= BUY BOOKS ================= */

const resaleBooks = [
{
name:"Teaching Aptitude",
author:"Ravi Kumar",
price:"250"
},
{
name:"Child Development",
author:"Suresh",
price:"300"
}
];

/* LOAD BUY BOOKS */
function loadBuyBooks(){

let container = document.getElementById("buyBooks");

container.innerHTML = "<h3 style='margin-top:20px'>📦 Buy Used Books</h3>";

resaleBooks.forEach(b=>{

container.innerHTML += `
<div class="card">
<div>
<b>${b.name}</b><br>
<small>${b.author}</small><br>
₹${b.price}
</div>
<button class="btn" onclick="buyBook('${b.name}','${b.author}','${b.price}')">Buy</button>
</div>
`;

});

}

/* ================= BUY BUTTON ================= */

function buyBook(name,author,price){

let user = JSON.parse(localStorage.getItem("user"));

let msg =
`📚 Book Purchase Request

Book: ${name}
Author: ${author}
Price: ₹${price}

Buyer: ${user?.name || "User"}

I want to buy this book.`;

let url = "https://wa.me/919655969516?text=" + encodeURIComponent(msg);

window.open(url);
}
</script>

</body>
</html>
