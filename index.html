<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B.Ed Vault Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
--primary:#2563eb;
--accent:#6366f1;
--bg:#eef2ff;
--card:#ffffff;
--text:#1e293b;
--shadow:0 20px 50px rgba(0,0,0,0.08);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
background:linear-gradient(135deg,#eef2ff,#e0e7ff);
color:var(--text);
}

/* HEADER */
.header{
padding:20px;
background:linear-gradient(135deg,#2563eb,#6366f1);
color:white;
border-bottom-left-radius:25px;
border-bottom-right-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.header h1{font-size:20px;}
.header p{font-size:12px;opacity:0.8;}

/* REGISTER */
.register{
max-width:420px;
margin:30px auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:var(--shadow);
}

.input-group{
position:relative;
margin-bottom:14px;
}

.input-group i{
position:absolute;
top:14px;
left:14px;
color:#64748b;
}

.input-group input,
.input-group select{
width:100%;
padding:13px 12px 13px 42px;
border-radius:12px;
border:1px solid #ddd;
}

.primary-btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,var(--primary),var(--accent));
color:white;
font-weight:600;
}

/* PAGE */
.page{display:none;padding:18px;padding-bottom:100px;}
.page.active{display:block;}

/* SEARCH */
.search-box{position:relative;margin-bottom:15px;}
.search-box input{
width:100%;
padding:12px 40px;
border-radius:12px;
border:none;
box-shadow:var(--shadow);
}
.search-box i{
position:absolute;
top:12px;
left:12px;
}

/* CARD */
.card{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:var(--shadow);
display:flex;
justify-content:space-between;
align-items:center;
}

/* BUTTON */
.btn{
background:var(--primary);
color:white;
border:none;
padding:8px 12px;
border-radius:10px;
}

/* NAV */
.nav{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:420px;
background:white;
border-radius:20px;
display:none;
justify-content:space-around;
padding:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.nav button{
border:none;
background:none;
display:flex;
flex-direction:column;
align-items:center;
font-size:11px;
position:relative;
}

.nav i{
font-size:18px;
color:var(--primary);
}

/* BADGE */
.badge{
position:absolute;
top:-3px;
right:6px;
background:red;
color:white;
font-size:10px;
padding:2px 6px;
border-radius:10px;
display:none;
}

/* NOTICE */
.notice{
background:white;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:var(--shadow);
}

/* VIEWER */
.viewer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
display:none;
z-index:999;
}
.viewer iframe{
width:100%;
height:100%;
border:none;
}
.close{
position:absolute;
top:10px;
right:10px;
background:white;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
display:none;
justify-content:center;
align-items:center;
z-index:1000;
}
.popup-box{
background:white;
padding:25px;
border-radius:18px;
text-align:center;
}
.popup button{
margin-top:10px;
padding:10px;
border:none;
background:var(--primary);
color:white;
border-radius:8px;
}

</style>
</head>

<body>

<div class="header">
<h1>🎓 B.Ed Vault</h1>
<p>Your Smart Study Companion</p>
</div>

<!-- REGISTER -->
<div id="registerPage" class="register">

<div class="input-group"><i class="fa fa-user"></i><input id="name" placeholder="Name"></div>
<div class="input-group"><i class="fa fa-calendar"></i><input id="dob" type="date"></div>

<div class="input-group">
<select id="gender"><option value="">Gender</option><option>Male</option><option>Female</option></select>
</div>

<div class="input-group"><input id="college" placeholder="College"></div>
<div class="input-group"><input id="district" placeholder="District"></div>
<div class="input-group"><input id="phone" placeholder="Phone"></div>

<div class="input-group">
<select id="semester">
<option value="">Semester</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
</select>
</div>

<label><input type="checkbox" id="agree"> Agree</label><br><br>

<button class="primary-btn" onclick="registerUser()">Register</button>

</div>

<!-- HOME -->
<div id="home" class="page">

<div class="card">
📚 Study Notes
<button class="btn" onclick="showPage('notes')">Open</button>
</div>

<div class="card">
🔔 TNTEU Updates
<button class="btn" onclick="showPage('notices')">Open</button>
</div>

</div>

<!-- NOTES -->
<div id="notes" class="page">

<h3 id="semTitle"></h3>

<div class="search-box">
<i class="fa fa-search"></i>
<input id="search" placeholder="Search..." onkeyup="searchNotes()">
</div>

<div id="noteList"></div>

</div>

<!-- NOTICES -->
<div id="notices" class="page">
<div id="noticeList"></div>
</div>

<!-- NAV -->
<div id="nav" class="nav">
<button onclick="showPage('home')"><i class="fa fa-house"></i>Home</button>
<button onclick="showPage('notes')"><i class="fa fa-book"></i>Notes</button>
<button onclick="showPage('notices')"><i class="fa fa-bell"></i>Updates<span id="badge" class="badge">1</span></button>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<div class="close" onclick="closePDF()">Close</div>
<iframe id="frame"></iframe>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<div class="popup-box">
<div id="popupMsg"></div>
<button onclick="closePopup()">OK</button>
</div>
</div>

<script>

const SCRIPT_URL="PASTE_URL";
const base="web/PDFs/";

/* POPUP */
function showPopup(msg){
popupMsg.innerText=msg;
popup.style.display="flex";
}
function closePopup(){popup.style.display="none";}

/* REGISTER */
function registerUser(){

let data={
name:name.value,dob:dob.value,gender:gender.value,
college:college.value,district:district.value,
phone:phone.value,semester:semester.value
};

if(Object.values(data).includes("")||!agree.checked){
showPopup("Fill all fields");
return;
}

localStorage.setItem("user",JSON.stringify(data));

fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(data)});

showPopup("🎉 Registered Successfully!");
setTimeout(()=>location.reload(),1500);
}

/* AUTO LOGIN */
let user=JSON.parse(localStorage.getItem("user"));
if(user){
registerPage.style.display="none";
nav.style.display="flex";
home.classList.add("active");
}

/* NOTES */
const books=[
{sem:"Semester 1",title:"BD1CE Unit 1 ENG",file:"BD1CE Unit-1 ENG.pdf"},
{sem:"Semester 1",title:"BD1CE Unit 2 ENG",file:"BD1CE Unit-2 ENG.pdf"},
{sem:"Semester 2",title:"BD2EE Unit 1 TAM",file:"BD2EE Unit-1.pdf"}
];

if(user){
semTitle.innerText=user.semester+" Notes";

books.forEach(b=>{
if(b.sem!==user.semester)return;

noteList.innerHTML+=`
<div class="card">${b.title}
<button class="btn" onclick="openPDF('${b.file}')">Open</button>
</div>`;
});
}

/* SEARCH */
function searchNotes(){
let s=search.value.toLowerCase();
document.querySelectorAll("#noteList .card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(s)?"flex":"none";
});
}

/* PDF VIEWER */
function openPDF(file){

let encoded = encodeURIComponent(file);

/* FULL RELATIVE PATH */
let pdfURL = "web/PDFs/" + encoded;

/* IMPORTANT: use full origin for GitHub */
let fullURL = window.location.origin + "/" + pdfURL;

/* FINAL VIEWER URL */
let viewerURL = "web/viewer.html?file=" + encodeURIComponent(fullURL);

/* OPEN */
document.getElementById("viewer").style.display = "block";
document.getElementById("frame").src = viewerURL;

}
function closePDF(){
viewer.style.display="none";
frame.src="";
}

/* NAV */
function showPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
if(p==="notices") badge.style.display="none";
}

/* NOTIFICATIONS */
async function loadNotices(){
const proxy="https://api.codetabs.com/v1/proxy/?quest=";
const target="https://www.tnteu.ac.in/notifications.php?nid=5";

let res=await fetch(proxy+encodeURIComponent(target));
let html=await res.text();
let doc=new DOMParser().parseFromString(html,"text/html");
let links=doc.querySelectorAll(".sectionWrapper a");

let first="",saved=localStorage.getItem("lastNotice"),out="";

links.forEach((a,i)=>{
if(i>10)return;
let title=a.innerText;
let url="https://www.tnteu.ac.in/"+a.getAttribute("href");
if(i===0) first=title;

out+=`<div class="notice">${title}
<button class="btn" onclick="window.open('${url}')">View</button>
</div>`;
});

noticeList.innerHTML=out;

if(saved&&saved!==first) badge.style.display="block";
localStorage.setItem("lastNotice",first);
}

loadNotices();

</script>

</body>
</html>
