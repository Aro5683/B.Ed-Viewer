<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>B.Ed Vault</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
--primary:#2563eb;
--accent:#6366f1;
--bg:#eef2ff;
--card:#ffffff;
--text:#1f2937;
--shadow:0 15px 40px rgba(0,0,0,0.08);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI;}

body{
background:linear-gradient(135deg,#eef2ff,#e0e7ff);
}

/* HEADER */
header{
background:linear-gradient(90deg,var(--primary),var(--accent));
color:white;
padding:18px;
font-size:20px;
font-weight:600;
text-align:center;
border-bottom-left-radius:20px;
border-bottom-right-radius:20px;
}

/* REGISTER */
.login{
max-width:420px;
margin:40px auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:var(--shadow);
}

.login input,.login select{
width:100%;
padding:12px;
margin-bottom:12px;
border-radius:10px;
border:1px solid #ddd;
}

.login button{
width:100%;
padding:12px;
background:linear-gradient(90deg,var(--primary),var(--accent));
color:white;
border:none;
border-radius:10px;
font-weight:600;
}

/* PAGE */
.page{
display:none;
max-width:800px;
margin:auto;
padding:18px;
padding-bottom:90px;
}
.page.active{display:block;}

/* CARD */
.card{
background:white;
border-radius:14px;
padding:16px;
margin-bottom:12px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:var(--shadow);
}

.btn{
background:var(--primary);
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
}

/* SEARCH */
.search{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-bottom:12px;
}

/* VIEWER */
.viewer{
position:fixed;
top:0;left:0;width:100%;height:100%;
background:black;display:none;z-index:999;
}
.viewer iframe{width:100%;height:100%;}
.close{
position:absolute;top:10px;right:10px;
background:white;padding:6px 12px;border-radius:6px;
}

/* NAV */
.nav{
position:fixed;bottom:0;width:100%;
background:white;
display:flex;justify-content:space-around;
padding:10px;
box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

.nav button{
background:none;border:none;
display:flex;flex-direction:column;align-items:center;
font-size:11px;position:relative;
}

.nav i{font-size:18px;color:var(--primary);}

/* BADGE */
.badge{
position:absolute;top:-4px;right:6px;
background:red;color:white;font-size:10px;
padding:2px 6px;border-radius:10px;display:none;
}

/* NOTICE */
.noticeCard{
background:white;border-radius:12px;padding:14px;
margin-bottom:12px;display:flex;
justify-content:space-between;
box-shadow:var(--shadow);
border-left:4px solid var(--primary);
}

/* POPUP */
.popup{
position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.5);
display:none;justify-content:center;align-items:center;
z-index:1000;
}
.popup-box{
background:white;padding:25px;border-radius:16px;
text-align:center;width:300px;
}
.popup button{
margin-top:10px;padding:10px;border:none;
background:var(--primary);color:white;border-radius:8px;
}

</style>
</head>

<body>

<header>
<i class="fa-solid fa-graduation-cap"></i> B.Ed Vault
</header>

<!-- REGISTER -->
<div id="loginPage" class="login">

<h2 style="text-align:center;margin-bottom:10px;">Student Registration</h2>

<input id="name" placeholder="Name">
<input id="dob" type="date">

<select id="gender">
<option value="">Gender</option>
<option>Male</option>
<option>Female</option>
</select>

<input id="college" placeholder="College">
<input id="district" placeholder="District">
<input id="phone" placeholder="Phone">

<select id="semester">
<option value="">Semester</option>
<option>Semester 1</option>
<option>Semester 2</option>
<option>Semester 3</option>
<option>Semester 4</option>
</select>

<label><input type="checkbox" id="agree"> Agree terms</label>

<button onclick="registerUser()">Register</button>

</div>

<!-- HOME -->
<div id="home" class="page">
<div class="card">📚 Notes <button class="btn" onclick="showPage('notes')">Open</button></div>
<div class="card">🔔 Updates <button class="btn" onclick="showPage('notices')">Open</button></div>
</div>

<!-- NOTES -->
<div id="notes" class="page">
<h3 id="semTitle"></h3>
<input class="search" id="search" placeholder="Search..." onkeyup="searchNotes()">
<div id="noteList"></div>
</div>

<!-- NOTICES -->
<div id="notices" class="page">
<h3>TNTEU Notifications</h3>
<div id="noticeList"></div>
</div>

<!-- VIEWER -->
<div class="viewer" id="viewer">
<div class="close" onclick="closePDF()">Close</div>
<iframe id="frame"></iframe>
</div>

<!-- NAV -->
<div class="nav">
<button onclick="showPage('home')"><i class="fa fa-house"></i>Home</button>
<button onclick="showPage('notes')"><i class="fa fa-book"></i>Notes</button>
<button onclick="showPage('notices')"><i class="fa fa-bell"></i>Updates
<span id="noticeBadge" class="badge">1</span>
</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
<div class="popup-box">
<div id="popupMsg"></div>
<button onclick="popup.style.display='none'">OK</button>
</div>
</div>

<script>

const SCRIPT_URL="PASTE_GOOGLE_SCRIPT_URL";

/* POPUP */
function showPopup(msg){
popupMsg.innerText=msg;
popup.style.display="flex";
}

/* REGISTER */
function registerUser(){

let data={
name:name.value,dob:dob.value,gender:gender.value,
college:college.value,district:district.value,
phone:phone.value,semester:semester.value
};

if(Object.values(data).includes("")||!agree.checked){
showPopup("Fill all fields");
return;
}

localStorage.setItem("semester",data.semester);
localStorage.setItem("logged","yes");

/* SEND TO SHEET */
fetch(SCRIPT_URL,{
method:"POST",
mode:"no-cors",
body:JSON.stringify(data)
});

showPopup("🎉 Registration Successful!");
setTimeout(()=>location.reload(),1500);
}

/* LOGIN CHECK */
if(localStorage.getItem("logged")){
loginPage.style.display="none";
home.classList.add("active");
}

/* NOTES */
const base="PDFs/";

const books=[
{sem:"Semester 1",title:"BD1CE Unit 1 ENG",file:"BD1CE Unit-1 ENG.pdf"},
{sem:"Semester 1",title:"BD1CE Unit 2 ENG",file:"BD1CE Unit-2 ENG.pdf"},
{sem:"Semester 2",title:"BD2EE Unit 1 TAM",file:"BD2EE Unit-1.pdf"}
];

let userSem=localStorage.getItem("semester");

semTitle.innerText=userSem+" Notes";

books.forEach(b=>{
if(b.sem!==userSem)return;

noteList.innerHTML+=`
<div class="card">
${b.title}
<button class="btn" onclick="openPDF('${b.file}')">Open</button>
</div>`;
});

/* SEARCH */
function searchNotes(){
let s=search.value.toLowerCase();
document.querySelectorAll("#noteList .card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(s)?"flex":"none";
});
}

/* PDF */
function openPDF(file){
let url=base+encodeURIComponent(file);
frame.src="web/viewer.html?file="+url;
viewer.style.display="block";
}
function closePDF(){
viewer.style.display="none";
frame.src="";
}

/* NAV */
function showPage(p){
document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
document.getElementById(p).classList.add("active");
if(p==="notices"){noticeBadge.style.display="none";}
}

/* NOTICES */
async function loadNotices(){
const proxy="https://api.codetabs.com/v1/proxy/?quest=";
const target="https://www.tnteu.ac.in/notifications.php?nid=5";

let res=await fetch(proxy+encodeURIComponent(target));
let html=await res.text();
let doc=new DOMParser().parseFromString(html,"text/html");
let links=doc.querySelectorAll(".sectionWrapper a");

let first="",saved=localStorage.getItem("lastNotice"),out="";

links.forEach((a,i)=>{
if(i>12)return;

let title=a.innerText;
let url="https://www.tnteu.ac.in/"+a.getAttribute("href");

if(i===0) first=title;

out+=`<div class="noticeCard">${title}
<button class="btn" onclick="window.open('${url}')">Open</button>
</div>`;
});

noticeList.innerHTML=out;

if(saved&&saved!==first){
noticeBadge.style.display="block";
}

localStorage.setItem("lastNotice",first);
}

loadNotices();

</script>

</body>
</html>
